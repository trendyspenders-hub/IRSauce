name: Build and package I.R.Sauce
on:
  push:
    paths-ignore: ['Docs/**', 'Preview/**', '**/*.md', '**/*.txt', 'LICENSE', 'licenses/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    if: "!contains(github.event.head_commit.message, '[repackage]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure universal binary
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release '-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64' -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - name: Compile
        run: cmake --build build --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Render native animation preview
        run: ./build/sauce_processor_tests --render-animation preview-frames
      - uses: actions/upload-artifact@v4
        with:
          name: IRSauce-Animation-Preview
          path: preview-frames/
      - name: Preserve tested Mac binaries
        uses: actions/upload-artifact@v4
        with:
          name: IRSauce-Mac-Tested-Binaries
          path: |
            build/IRSauce_artefacts/Release/AU/
            build/IRSauce_artefacts/Release/VST3/
      - name: Package Mac installer
        run: bash scripts/package-mac.sh "$PWD/build"
      - name: Create verified DMG
        run: bash scripts/create-dmg.sh
      - name: Validate Audio Unit
        run: bash scripts/validate-au.sh "$PWD/build"
      - uses: actions/upload-artifact@v4
        with:
          name: IRSauce-Mac-Installer-unsigned
          path: dist/
  windows:
    if: "!contains(github.event.head_commit.message, '[repackage]')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -A x64
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure
      - uses: actions/upload-artifact@v4
        with:
          name: IRSauce-Windows-VST3
          path: build/IRSauce_artefacts/Release/
