name: Validate and package tested Mac plugins
on:
  push:
    paths: ['.github/workflows/repackage-mac.yml', 'scripts/validate-au.sh']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    if: "github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[repackage]')"
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: IRSauce-Mac-Tested-Binaries
          run-id: 40121644137
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/IRSauce_artefacts/Release/
      - name: Restore executable modes
        run: |
          chmod +x build/IRSauce_artefacts/Release/AU/IRSauce.component/Contents/MacOS/IRSauce
          chmod +x build/IRSauce_artefacts/Release/VST3/IRSauce.vst3/Contents/MacOS/IRSauce
      - name: Validate Audio Unit with refreshed registration
        run: bash scripts/validate-au.sh "$PWD/build"
      - name: Package AU and VST3
        run: bash scripts/package-mac.sh "$PWD/build"
      - name: Create and verify DMG
        run: bash scripts/create-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: IRSauce-Mac-Installer-unsigned
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: IRSauce-Mac-Validation-Logs
          path: dist/*.log
